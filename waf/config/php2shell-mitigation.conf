# Regras customizadas de mitigação para CVE-2026-109618 e CVE-2026-109619 (php2shell)
# 1. Bloqueia tentativas de injeção de parâmetros de CLI (-d, -n, auto_prepend_file, memory_limit)
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS "@rx (?i)(?:allow_url_include|auto_prepend_file|auto_append_file|disable_functions|open_basedir|cgi\.force_redirect)" \
    "id:1000001,phase:2,deny,status:403,log,msg:'[php2shell Mitigation] Tentativa de sobrescrever diretivas críticas do PHP detectada'"

# 2. Bloqueia requisições forjadas com tamanhos anômalos de cabeçalho ou payloads projetados para acionar OOM no parser
SecRule REQUEST_LINE "@rx (?i)(?:-d\s*memory_limit|-d\s*max_execution_time)" \
    "id:1000002,phase:1,deny,status:403,log,msg:'[php2shell Mitigation] Tentativa de injeção de argumentos no interpretador PHP'"
