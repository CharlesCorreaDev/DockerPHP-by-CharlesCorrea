# Regras de DNSBL em Tempo Real (Phase 1 = Imediatamente ao receber os cabeçalhos)

# 1. Spamhaus ZEN (Inclui IPs de Spam, Botnets e Exploits)
SecRule REMOTE_ADDR "@rbl zen.spamhaus.org" \
    "id:999001,\
    phase:1,\
    drop,\
    status:444,\
    log,\
    msg:'Acesso Bloqueado: IP listado na DNSBL Spamhaus ZEN'"

# 2. Barracuda Central (Reputação Ruim / Spammers)
SecRule REMOTE_ADDR "@rbl b.barracudacentral.org" \
    "id:999002,\
    phase:1,\
    drop,\
    status:444,\
    log,\
    msg:'Acesso Bloqueado: IP listado na DNSBL Barracuda Central'"

# 3. DroneBL (Foco em IPs de Proxies Abusivos, VPNs Maliciosas e Botnets de IoT)
SecRule REMOTE_ADDR "@rbl dnsbl.dronebl.org" \
    "id:999003,\
    phase:1,\
    drop,\
    status:444,\
    log,\
    msg:'Acesso Bloqueado: IP listado na DNSBL DroneBL'"
