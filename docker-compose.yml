    networks:
      - cluster_network

  # ==============================================================================
  # ANTIVIRUS CLAMAV (Daemon de Varredura Multithread)
  # ==============================================================================
  app_clamav:
    image: clamav/clamav:latest
    container_name: app_clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
      - ./logs/antivirus:/var/log/clamav
    networks:
      - cluster_network

  # ==============================================================================
  # SENTINELA & MONITOR DE RECURSOS (Python Daemon + Docker API)
  # ==============================================================================
  app_monitor:
    build:
      context: ./sentinela
      dockerfile: ./docker/Dockerfile
    container_name: app_monitor
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_TO=${SMTP_TO}
      - ALERT_CHANNEL_EMAIL=${ALERT_CHANNEL_EMAIL:-false}
      - ALERT_CHANNEL_TELEGRAM=${ALERT_CHANNEL_TELEGRAM:-false}
      - ALERT_CHANNEL_SMS=${ALERT_CHANNEL_SMS:-false}
      - SMS_LEGAL_TOKEN=${SMS_LEGAL_TOKEN}
      - SMS_LEGAL_TO=${SMS_LEGAL_TO}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS}
      - CPU_THRESHOLD=${CPU_THRESHOLD:-70.0}
      - MEM_THRESHOLD=${MEM_THRESHOLD:-70.0}
      - DISK_THRESHOLD=${DISK_THRESHOLD:-70.0}
      - CLAMAV_HOST=app_clamav
      - CLAMAV_PORT=3310
      - SCAN_DIR=/scandata
      - QUARANTINE_DIR=/quarantine
      - LOGS_DIR=/logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./Application:/scandata
      - ./antivirus/quarentena:/quarantine
      - ./logs:/logs
      - ./ssl/certs:/certs:ro
      - ./ssl/letsencrypt:/letsencrypt:ro
    depends_on:
      - app_clamav
    networks:
      - cluster_network

  # ==============================================================================
  # CRONJOBS (Master-Cron Orquestrador de Tarefas Agendadas)
  # ==============================================================================
  app_cronjobs:
    build:
      context: ./Cronjobs
      dockerfile: Dockerfile
    container_name: app_cronjobs
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./Cronjobs/Jobs/tasks:/app/tasks:ro
      - ./Cronjobs/Scripts:/app/scripts:ro
      - ./logs:/logs
    environment:
      - CRON_TASKS_CONFIG=/app/tasks/tasks.json
    networks:
      - cluster_network

  # ==============================================================================
  # HONEYPOT IA - Moqesh (labirinto Token Exhaust contra agentes de IA autonomos)
  # Codigo/config em ./honeypot/IA
  # ==============================================================================
  app_honeypot_ia:
    # Imagem do GHCR nao e publica -> build do fonte clonado em ./honeypot/IA/moqesh
    # (git clone --depth 1 https://github.com/juliourena/moqesh.git honeypot/IA/moqesh)
    build:
      context: ./honeypot/IA/moqesh
      dockerfile: ../Dockerfile.moqesh
    image: moqesh:local
    container_name: app_honeypot_ia
    restart: unless-stopped
    expose:
      - "8080"   # honeypot (roteado pelo Traefik nas rotas-isca)
      - "5000"   # dashboard (somente via Traefik com auth)
    environment:
      - TZ=America/Sao_Paulo
      - LANG=pt_BR.UTF-8
      - MOQESH_DB_PATH=/app/data/moqesh.db
      - MOQESH_SEED=${MOQESH_SEED:-}
      - MOQESH_GENERATION_MODE=Template
      - MOQESH_SITE_PROFILE=${MOQESH_SITE_PROFILE:-corp}
      - MOQESH_WORLD_ENABLED=false
      - MOQESH_ADAPTIVE_TARPIT=true
      - MOQESH_ENFORCE_BLOCK=true
      - MOQESH_AUTO_BLOCK_SCORE=${MOQESH_AUTO_BLOCK_SCORE:-0.8}
      - MOQESH_WEBHOOK_URL=http://app_honeypot_ia_bridge:8090/hook/moqesh
      - MOQESH_WEBHOOK_SECRET=${MOQESH_WEBHOOK_SECRET:-}
      - MOQESH_ADMIN_USER=${MOQESH_ADMIN_USER:-admin}
      - MOQESH_ADMIN_PASSWORD=${MOQESH_ADMIN_PASSWORD:-}
      - MOQESH_COOKIE_SECURE=true
    volumes:
      - moqesh_data:/app/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - cluster_network

  # Ponte webhook Moqesh -> blocklist dos WAFs
  app_honeypot_ia_bridge:
    build:
      context: ./honeypot/IA/bridge
    container_name: app_honeypot_ia_bridge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8090"
    environment:
      - TZ=America/Sao_Paulo
      - LANG=pt_BR.UTF-8
      - MOQESH_WEBHOOK_SECRET=${MOQESH_WEBHOOK_SECRET:-}
      - HONEYPOT_WHITELIST=${HONEYPOT_WHITELIST:-127.0.0.1/32}
    volumes:
      - ./honeypot/blocklist:/blocklist
      - ./logs/docker/honeypot:/logs
    networks:
      - cluster_network

  # ==============================================================================
  # HONEYPOT ROBOTS - scanners, brute-force, exploit kits (tarpit + blocklist)
  # Codigo em ./honeypot/Robots
  # ==============================================================================
  app_honeypot_robots:
    build:
      context: ./honeypot/Robots
    container_name: app_honeypot_robots
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8081"
    environment:
      - TZ=America/Sao_Paulo
      - LANG=pt_BR.UTF-8
      - ROBOTS_BLOCK_THRESHOLD=${ROBOTS_BLOCK_THRESHOLD:-2}
      - HONEYPOT_WHITELIST=${HONEYPOT_WHITELIST:-127.0.0.1/32}
    volumes:
      - ./honeypot/blocklist:/blocklist
      - ./logs/docker/honeypot:/logs
    networks:
      - cluster_network

  # ==============================================================================
  # COLETOR DE LOGS DOCKER (stdout/stderr de cada container -> ./logs/docker)
  # ==============================================================================
  app_log_collector:
    image: docker:cli
    container_name: app_log_collector
    restart: unless-stopped
    entrypoint: ["sh", "/collect.sh"]
    environment:
      - TZ=America/Sao_Paulo
      - LANG=pt_BR.UTF-8
      - LOG_PROJECT=${COMPOSE_PROJECT_NAME:-php83}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/log-collector/collect.sh:/collect.sh:ro
      - ./logs/docker:/logs
    networks:
      - cluster_network

networks:
  cluster_network:
    driver: bridge

volumes:
  moqesh_data:
  clamav_db:
