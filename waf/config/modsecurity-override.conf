# ==============================================================================
# REGRAS CUSTOMIZADAS DE MITIGAÇÃO ENTERPRISE (OWASP MODSECURITY CRS / WAF)
# Proteção Total: CVEs, Anti-Bot/OSINT, Anti-SQLi, Anti-XSS, Anti-CSRF,
# Anti-Object-Injection, Manipulação de Cookies, Backdoors e Hardening de Sessão
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MITIGAÇÃO php2shell (CVE-2026-109618 & CVE-2026-109619)
# ------------------------------------------------------------------------------
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS "@rx (?i)(?:allow_url_include|auto_prepend_file|auto_append_file|disable_functions|open_basedir|cgi\.force_redirect)" \
    "id:1000001,phase:2,deny,status:403,log,msg:'[php2shell Mitigation] Tentativa de sobrescrever diretivas criticas do PHP detectada'"

SecRule REQUEST_LINE "@rx (?i)(?:-d\s*memory_limit|-d\s*max_execution_time|-d\s*display_errors)" \
    "id:1000002,phase:1,deny,status:403,log,msg:'[php2shell Mitigation] Tentativa de injecao de argumentos no interpretador PHP detectada'"

# ------------------------------------------------------------------------------
# 2. BLOQUEIO MACIÇO: OSINT, MOTORES DE BUSCA, RASPAGEM E AGENTES DE IA
# ------------------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:GPTBot|ChatGPT-User|OpenAI|Anthropic|ClaudeBot|Claude-Web|cohere-ai|Google-Extended|PerplexityBot|Perplexity|Bytespider|Diffbot|FacebookBot|Meta-ExternalAgent|OAI-SearchBot|Applebot-Extended|Omgili|Omgilibot|Timpibot|Kangaroo\s*Bot|Amazonbot|iaskspider|YouBot|Poe-User|AI-Agent|LangChain|AutoGPT|BabyAGI|AgentOps|CrewAI|LlamaIndex|AgentQL|ScrapeGraph|Dify)" \
    "id:1000010,phase:1,deny,status:403,log,msg:'[Anti-AI] Agente de IA, LLM Scraper ou Web Crawler de Treinamento bloqueado'"

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:Shodan|Censys|SecurityTrails|BinaryEdge|LeakIX|Spyse|Shadowserver|ZoomEye|Netcraft|Onyphe|GreyNoise|ProjectDiscovery|Hunter\.how|FOFA|CriminalIP|Rapid7|AlphaQuery|Intelligence\s*X|PaloAltoNetworks|Expanse|Bitsight|RiskIQ|Cybereason|ThreatConnect|Recorded\s*Future)" \
    "id:1000011,phase:1,deny,status:403,log,msg:'[Anti-OSINT] Ferramenta de OSINT e Reconhecimento bloqueada'"

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:Nmap|sqlmap|DirBuster|dirb|Nikto|zaproxy|WPScan|BurpSuite|Burp\s*Collaborator|Hydra|Gobuster|ffuf|Nuclei|nessus|masscan|Acunetix|Netsparker|Qualys|OpenVAS|Arachni|w3af|Skipfish|WhatWeb|BlindElephant|Gau|Katana|Sublist3r|Amass)" \
    "id:1000012,phase:1,deny,status:403,log,msg:'[Anti-Pentest] Scanner de vulnerabilidades ou fuzzer bloqueado'"

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:SemrushBot|AhrefsBot|MJ12bot|DotBot|MegaIndex|BLEXBot|ZoominfoBot|DataForSeoBot|PetalBot|Screaming\s*Frog|SEO\s*Spider|SiteAuditBot|CognitiveSEO|LinkpadBot|Seekport|Barkrowler|CriteoBot|Buck|archive\.org_bot|ia_archiver|Web-Harvest|BrightData|Oxylabs|Smartproxy|Apify|ScraperAPI|ZenRows|ScrapingBee|Crawlbase|Firecrawl|Spider-Cloud)" \
    "id:1000013,phase:1,deny,status:403,log,msg:'[Anti-Scraper] Crawler comercial, raspador de dados ou SEO bot bloqueado'"

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:python-requests|aiohttp|urllib|libwww-perl|curl|Wget|PycURL|Scrapy|Mechanize|Go-http-client|Java\/|okhttp|HttpClient|node-fetch|Axios|Got\/|Needle|Puppeteer|Playwright|Selenium|PhantomJS|Splash|HeadlessChrome|webdriver)" \
    "id:1000014,phase:1,deny,status:403,log,msg:'[Anti-Scraper] Biblioteca de script automatizado ou headless browser bloqueado'"

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:bot|crawler|spider|scraper|crawling|archiver|transcoder|Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|facebot|facebookexternalhit|Applebot|NaverBot|SeznamBot|CocCocBot|Qwantify|SentiBot|MojeekBot)" \
    "id:1000015,phase:1,deny,status:403,log,msg:'[Anti-Crawler] Motor de busca ou indexador geral bloqueado'"

SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:1000016,phase:1,deny,status:403,log,msg:'[Anti-Bot] Acesso sem cabecalho User-Agent bloqueado'"

SecRule REQUEST_HEADERS:User-Agent "^$" \
    "id:1000017,phase:1,deny,status:403,log,msg:'[Anti-Bot] Acesso com User-Agent vazio bloqueado'"

SecRule REQUEST_HEADERS:User-Agent "^\s+$" \
    "id:1000018,phase:1,deny,status:403,log,msg:'[Anti-Bot] Acesso com User-Agent espacos em branco bloqueado'"

# ------------------------------------------------------------------------------
# 3. ANTI-SQL INJECTION (SQLi Avançado em Parâmetros, Headers e Cookies)
# ------------------------------------------------------------------------------
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_BODY|REQUEST_HEADERS "@rx (?i)(?:\b(?:select\b.*\bfrom|insert\b.*\binto|update\b.*\bset|delete\b.*\bfrom|drop\b\s+(?:table|database|view)|truncate\b\s+table|alter\b\s+table|union\b(?:\s+all)?\s+select)\b)" \
    "id:1000031,phase:2,deny,status:403,log,msg:'[Anti-SQLi] Instrucao SQL estruturada de manipulacao ou exfiltracao detectada'"

SecRule ARGS|REQUEST_LINE|REQUEST_COOKIES "@rx (?i)(?:sleep\s*\(\s*\d+\s*\)|benchmark\s*\(\s*\d+|waitfor\s+delay\s+'|\bpg_sleep\s*\(\s*\d+)" \
    "id:1000032,phase:2,deny,status:403,log,msg:'[Anti-SQLi] Tentativa de Blind Time-Based SQL Injection detectada'"

SecRule ARGS|REQUEST_LINE|REQUEST_COOKIES "@rx (?i)(?:'\s*(?:or|and)\s*'?\d+'?\s*=\s*'?\d+|--\s*$|/\*.*?\*/|0x[0-9a-fA-F]{4,})" \
    "id:1000033,phase:2,deny,status:403,log,msg:'[Anti-SQLi] Tentativa de Bypass de Autenticacao via Tautologia/Comentarios SQL'"

# ------------------------------------------------------------------------------
# 4. PREVENÇÃO DE XSS (Cross-Site Scripting - Stored, Reflected e DOM)
# ------------------------------------------------------------------------------
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS "@rx (?i)(?:<script[\s>].*?</script>|<.*?javascript:|<.*?on(?:load|error|click|mouseover|submit|focus|blur|change)\s*=|<svg[\s>].*?onload|document\.(?:cookie|location|write)|window\.(?:location|navigate)|eval\s*\(|setTimeout\s*\(|setInterval\s*\()" \
    "id:1000041,phase:2,deny,status:403,log,msg:'[Anti-XSS] Payload malicioso de script HTML/JavaScript detectado'"

SecRule ARGS|REQUEST_LINE|REQUEST_HEADERS "@rx (?i)(?:data:text/html|vbscript:|javascript:|livescript:)" \
    "id:1000042,phase:2,deny,status:403,log,msg:'[Anti-XSS] URI scheme de script inline malicioso detectado'"

# ------------------------------------------------------------------------------
# 5. PROTEÇÃO CONTRA CSRF & MANIPULAÇÃO DE ORIGEM
# ------------------------------------------------------------------------------
# Bloqueia requisições POST com Origin ou Referer cruzado não autorizado
SecRule REQUEST_METHOD "@streq POST" \
    "id:1000050,phase:1,chain,deny,status:403,log,msg:'[Anti-CSRF] Requisicao POST com Origem invalida ou suspeita'"
    SecRule REQUEST_HEADERS:Origin "!@rx (?i)^https?://(?:localhost|127\.0\.0\.1|docker\.charlescorrea\.com\.br|[\w\.-]+\.tur\.br)(?::\d+)?$" \
    "chain"
    SecRule REQUEST_HEADERS:Origin "!^$"

# ------------------------------------------------------------------------------
# 6. ANTI-OBJECT INJECTION & DESSERIALIZAÇÃO INSEGURA DO PHP
# ------------------------------------------------------------------------------
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_LINE|REQUEST_URI "@rx (?i)(?:O:\+?[0-9]+:[\"\\%]|a:[0-9]+:\{|s:[0-9]+:\"__PHP_Incomplete_Class\"|C:\+?[0-9]+:[\"\\%])" \
    "id:1000061,phase:1,deny,status:403,log,msg:'[Anti-Deserialization] Tentativa de PHP Object Injection serializado detectada'"

# Bloqueia invocação de wrappers PHP perigosos (LFI / RFI / SSRF)
SecRule ARGS|REQUEST_LINE|REQUEST_COOKIES "@rx (?i)(?:php://filter|php://input|php://phar|phar://|data://|zip://|expect://|file://)" \
    "id:1000062,phase:2,deny,status:403,log,msg:'[Anti-LFI/SSRF] Wrapper de fluxo interno PHP abusivo detectado'"

# ------------------------------------------------------------------------------
# 7. MANIPULAÇÃO DE COOKIES & SEGURANÇA DE SESSÃO
# ------------------------------------------------------------------------------
# Bloqueia tentativas de Session Fixation / Hijacking injetando caracteres de controle
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES "@rx [\r\n\0]" \
    "id:1000071,phase:1,deny,status:403,log,msg:'[Session Security] Tentativa de Cookie/Session Injection com Carriage Return ou Null Byte'"

# Bloqueia IDs de sessão adulterados que contenham caracteres perigosos (deve ser alfanumérico)
SecRule REQUEST_COOKIES:PHPSESSID|REQUEST_COOKIES:ASP_NET_SessionId "@rx [^a-zA-Z0-9,\-]" \
    "id:1000072,phase:1,deny,status:403,log,msg:'[Session Security] ID de Sessao adulterado com caracteres ilegais'"

# ------------------------------------------------------------------------------
# 8. DETECÇÃO DE WEBSHELLS, BACKDOORS E EXECUÇÃO REMOTA DE CÓDIGO (RCE)
# ------------------------------------------------------------------------------
SecRule ARGS|REQUEST_BODY|REQUEST_LINE "@rx (?i)(?:system\s*\(|passthru\s*\(|shell_exec\s*\(|exec\s*\(|popen\s*\(|proc_open\s*\(|assert\s*\(|create_function\s*\(|preg_replace\s*\(.*?/e|base64_decode\s*\(.*?eval)" \
    "id:1000081,phase:2,deny,status:403,log,msg:'[Anti-Backdoor/RCE] Tentativa de execucao de comando shell ou funcao de backdoor no PHP'"

SecRule ARGS|REQUEST_LINE "@rx (?i)(?:/bin/(?:bash|sh|zsh|dash)|cmd\.exe|powershell(?:\.exe)?|wget\s+http|curl\s+http|nc\s+-e|/dev/tcp/\d+)" \
    "id:1000082,phase:2,deny,status:403,log,msg:'[Anti-RCE] Invocacao explicita de binario de shell ou reverse shell detectada'"

# ------------------------------------------------------------------------------
# 9. REGRAS DE DNSBL EM TEMPO REAL (Reputação Global de IP contra Spammers & Botnets)
# ------------------------------------------------------------------------------
SecRule REMOTE_ADDR "@rx ^(?:127\.|10\.|172\.(?:1[6-9]|2[0-9]|3[0-1])\.|192\.168\.)" \
    "id:999000,phase:1,nolog,pass,skipAfter:END_DNSBL"

# 9.1 Spamhaus ZEN (IPs de Spam, Botnets e Exploits)
SecRule REMOTE_ADDR "@rbl zen.spamhaus.org" \
    "id:999001,phase:1,drop,status:403,log,msg:'[DNSBL] IP listado na Spamhaus ZEN (Botnet/Spam)'"

# 9.2 Barracuda Central (Reputação Ruim / Spammers Globais)
SecRule REMOTE_ADDR "@rbl b.barracudacentral.org" \
    "id:999002,phase:1,drop,status:403,log,msg:'[DNSBL] IP listado na Barracuda Central'"

# 9.3 DroneBL (Proxies abusivos, VPNs maliciosas e Botnets de IoT)
SecRule REMOTE_ADDR "@rbl dnsbl.dronebl.org" \
    "id:999003,phase:1,drop,status:403,log,msg:'[DNSBL] IP listado na DroneBL (Proxy/Botnet)'"

# 9.4 Composite Blocking List - CBL Abuseat (Hosts infectados com trojans e botnets)
SecRule REMOTE_ADDR "@rbl cbl.abuseat.org" \
    "id:999004,phase:1,drop,status:403,log,msg:'[DNSBL] IP listado na Composite Blocking List (CBL Abuseat)'"

# 9.5 SORBS Composite (Honeypots, Proxies Abertos e Invasores)
SecRule REMOTE_ADDR "@rbl dnsbl.sorbs.net" \
    "id:999005,phase:1,drop,status:403,log,msg:'[DNSBL] IP listado na SORBS Composite (Open Proxies/Invasores)'"

# 9.6 SpamCop (Hosts de tráfego malicioso e spam)
SecRule REMOTE_ADDR "@rbl bl.spamcop.net" \
    "id:999006,phase:1,drop,status:403,log,msg:'[DNSBL] IP listado na SpamCop (Spam/Abuse)'"

SecMarker END_DNSBL
